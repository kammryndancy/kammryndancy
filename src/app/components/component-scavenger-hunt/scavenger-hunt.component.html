<div class="scavenger-hunt">
  <header>
    <h1>Nature Scavenger Hunt</h1>
    <p>{{ description }}</p>
  </header>

  <div class="content">
    <div *ngIf="isHuntGenerated" class="progress-container">
      <h3>{{ userName ? userName + "'s" : "" }} Nature Find</h3>
      <div class="progress-bar">
        <div class="progress-fill" [style.width.%]="(completedCount / scavengerHuntItems.length * 100) || 0">
          <span>Progress: {{ completedCount }}/{{ scavengerHuntItems.length }} items found</span>
        </div>
      </div>
    </div>

    <div *ngIf="!isHuntGenerated" class="form-container">
      <form [formGroup]="scavengerHuntForm" (ngSubmit)="generateHunt()">
        <div class="form-group">
          <label for="userName">Your Name</label>
          <input type="text" id="userName" formControlName="userName">
        </div>
        <div class="form-group">
          <label for="itemCount">Number of Items</label>
          <input type="number" id="itemCount" formControlName="itemCount" min="1" max="20">
        </div>

        <div class="form-group">
          <label for="season">Season</label>
          <select id="season" formControlName="season">
            <option value="spring">Spring</option>
            <option value="summer">Summer</option>
            <option value="fall">Fall</option>
            <option value="winter">Winter</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" formControlName="includeAnimals">
            Include Animals
          </label>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" formControlName="includePlants">
            Include Plants
          </label>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" formControlName="includeInsects">
            Include Insects
          </label>
        </div>

        <button type="submit" [disabled]="!scavengerHuntForm.valid">Generate Hunt</button>
      </form>
    </div>

    <div *ngIf="isHuntGenerated" class="hunt-container">
      <div class="items-list">
        <div *ngFor="let item of scavengerHuntItems; index as i" class="item-card">
          <div class="item-content">
            <img [src]="item.image" [alt]="item.name" class="item-image">
            <h3>{{ item.name }}</h3>
            <p>{{ item.description }}</p>
            <p class="category">Category: {{ item.category }}</p>
            <div class="controls">
              <button (click)="toggleComplete(i)" [class.completed]="item.completed">
                {{ item.completed ? 'Completed' : 'Mark Complete' }}
              </button>
            </div>
          </div>
        </div>
      </div>
      <button (click)="resetHunt()">Reset Hunt</button>
    </div>
  </div>
</div>
