<header id="masthead" class="site-header site-header-white">
  <nav id="primary-navigation" class="site-navigation">
    <div class="container">
      <div class="navbar-header">
        <a routerLink="/home" class="site-title"><span>Kammryn</span>Dancy</a>
      </div>
      <div class="collapse navbar-collapse" id="agency-navbar-collapse">
        <ul class="nav navbar-nav navbar-right">
          <li routerLink="/photography" routerLinkActive="dark">
            <a class="nav-link" routerLink="/photography" routerLinkActive="dark" ariaCurrentWhenActive="page">Photography</a>
          </li>
          <li routerLink="/brewing" routerLinkActive="active">
            <a class="nav-link" routerLink="/brewing" routerLinkActive="active" ariaCurrentWhenActive="page">Brewing</a>
          </li>
          <li routerLink="/woodwork" routerLinkActive="dark">
            <a class="nav-link" routerLink="/woodwork" routerLinkActive="dark" ariaCurrentWhenActive="page">Woodworking</a>
          </li>
          <li routerLink="/spirits" routerLinkActive="active">
            <a class="nav-link" routerLink="/spirits" routerLinkActive="active" ariaCurrentWhenActive="page">Spirits</a>
          </li>
          <li routerLink="/roaster" routerLinkActive="active">
            <a class="nav-link" routerLink="/roaster" routerLinkActive="active" ariaCurrentWhenActive="page">Roastery</a>
          </li>
          <li class="dropdown" routerLinkActive="active" [class.open]="dndOpen" [class.active]="dndActive">
            <button class="dropdown-toggle nav-link" type="button" (click)="dndOpen = !dndOpen" aria-haspopup="true" [attr.aria-expanded]="dndOpen" [class.active]="dndActive">
              DnD Campaigns<i class="fa fa-caret-down hidden-xs" aria-hidden="true"></i>
            </button>
            <ul
              class="dropdown-menu"
              role="menu"
              aria-labelledby="menu1"
              [class.show]="dndOpen"
              [style.top]="dndOpen ? '100%' : '140%'"
            >
              <li routerLink="/withaerstice" routerLinkActive="active"><a routerLink="/withaerstice" routerLinkActive="active" (click)="dndOpen=false">Withaerstice</a></li>
              <li routerLink="/blacksheep" routerLinkActive="active"><a routerLink="/blacksheep" routerLinkActive="active" (click)="dndOpen=false">Black Sheep</a></li>
            </ul>
          </li>
          <li class="dropdown" routerLinkActive="active" [class.open]="toolsOpen" [class.active]="toolsActive">
            <button class="dropdown-toggle nav-link" type="button" (click)="toolsOpen = !toolsOpen" aria-haspopup="true" [attr.aria-expanded]="toolsOpen" [class.active]="toolsActive">
              Tools<i class="fa fa-caret-down hidden-xs" aria-hidden="true"></i>
            </button>
            <ul
              class="dropdown-menu"
              role="menu"
              aria-labelledby="menu1"
              [class.show]="toolsOpen"
              [style.top]="toolsOpen ? '100%' : '140%'"
            >
              <li routerLink="/scavenger-hunt" routerLinkActive="active"><a routerLink="/scavenger-hunt" routerLinkActive="active" (click)="toolsOpen=false">Scavenger Hunt</a></li>
              <li routerLink="/quilt" routerLinkActive="active"><a routerLink="/quilt" routerLinkActive="active" (click)="toolsOpen=false">Quilting</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
