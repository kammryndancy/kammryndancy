<div class="brewing-page">
  <landing 
    greeting="Welcome to the Brewery" 
    message="Explore my homebrewing adventures and recipes" 
    noticeButton="Request a Brew" 
    (noticeButtonClick)="openBrewModal()"
    imageId="/assets/images/landings/larch_valley.jpg"
  />

  <div *ngIf="showBrewModal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" (click)="closeBrewModal()">&times;</button>
      <brew-request-form (formSuccess)="onFormSuccess()"></brew-request-form>
    </div>
  </div>

  <div class="recipes-container">
    <div *ngIf="loading">Loading recipes...</div>
    <div *ngIf="error">{{ error }}</div>
    <app-beer-recipe
      *ngFor="let recipe of paginatedRecipes"
      [name]="recipe.name"
      [imageUrl]="recipe.imageUrl"
      [description]="recipe.description"
      [malts]="recipe.malts"
      [hops]="recipe.hops"
      [yeast]="recipe.yeast"
      [adjuncts]="recipe.adjuncts"
      [abv]="recipe.abv"
      [og]="recipe.og"
      [fg]="recipe.fg"
      [srm]="recipe.srm"
      [ibu]="recipe.ibu"
      [buGu]="recipe.buGu"
      [awards]="recipe.awards"
      [youtubeUrl]="recipe.youtubeUrl"
      [recipeUrl]="recipe.recipeUrl"
    ></app-beer-recipe>
    <div class="pagination" *ngIf="totalPages > 1">
      <button class="pagination-arrow" (click)="prevPage()" [disabled]="currentPage === 1">&lt;</button>
      <ng-container *ngFor="let page of [].constructor(totalPages); let i = index">
        <button class="pagination-page" (click)="goToPage(i+1)" [class.active]="currentPage === (i+1)">{{ i+1 }}</button>
      </ng-container>
      <button class="pagination-arrow" (click)="nextPage()" [disabled]="currentPage === totalPages">&gt;</button>
    </div>
  </div>
  <footerComp/>
</div>
