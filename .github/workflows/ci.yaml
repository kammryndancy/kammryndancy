name: Kammryn Dancy Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Checkout
        uses: actions/checkout@v2

      - name: Generate environment.prod.ts
        run: |
          echo "export const environment = {
            production: true,
            EMAILJS_SERVICE_ID: '${{ vars.EMAILJS_SERVICE_ID }}',
            EMAILJS_TEMPLATE_ID: '${{ vars.EMAILJS_TEMPLATE_ID }}',
            EMAILJS_USER_ID: '${{ vars.EMAILJS_USER_ID }}'
          };" > ./src/environments/environment.prod.ts

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test:headless

      - name: Build
        run: npm run build:prod

      - name: Deploy
        if: success()
        run: aws s3 sync ./dist/kammryndancy s3://kammryndancy.com
